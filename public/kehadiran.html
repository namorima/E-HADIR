<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>E-HADIR | Senarai Kehadiran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme before first paint (same "theme" key as index.html / setup.html). -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark-mode', dark);
      })();
    </script>

    <style>
      /* =====================================================================
       * Design tokens — follows BoardUI's semantic token set
       * (github.com/BoardUI/boardui, styles/theme.css, MIT). Kept in sync by
       * hand with setup.html: these pages share no CSS file.
       * ===================================================================== */
      :root {
        --accent-300: #93c5fd; --accent-400: #3392ff; --accent-500: #3b82f6;
        --accent-600: #2563eb; --accent-700: #1d4ed8;

        --bg-page: #f7f7f7;
        --bg-surface: #ffffff;
        --bg-tile: #f7f7f7;
        --bg-hover: #f7f7f7;
        --bg-input: #ebebeb;
        --bg-input-hover: #e3e3e3;
        --seg-bg: #ebebeb;
        --seg-selected: #ffffff;
        --row-present: rgb(22 163 74 / 0.06);
        --row-present-hover: rgb(22 163 74 / 0.1);

        --text-primary: #0a0a0a;
        --text-secondary: #737373;
        --text-tertiary: #a3a3a3;
        --text-placeholder: #a3a3a3;
        --icon-tertiary: #a3a3a3;

        --border: #ebebeb;
        --border-btn: #ebebeb;
        --border-btn-hover: #d4d4d4;

        --green-bg: #dcfce7; --green-fg: #15803d; --green-solid: #16a34a;
        --purple-bg: #f3e8ff; --purple-fg: #7e22ce; --purple-solid: #9333ea;
        --blue-bg: #dbeafe; --blue-fg: #1d4ed8;
        --red-bg: #fee2e2; --red-fg: #dc2626;
        --neutral-bg: #ebebeb; --neutral-fg: #525252;

        --shadow-2xs: 0 1px 1px 0 rgb(0 0 0 / 0.06);
        --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.08);
        --page-veil: rgb(247 247 247 / 0.84);
      }

      .dark-mode {
        --bg-page: #121212;
        --bg-surface: #171717;
        --bg-tile: #1f1f1f;
        --bg-hover: #1f1f1f;
        --bg-input: #262626;
        --bg-input-hover: #2e2e2e;
        --seg-bg: #1f1f1f;
        --seg-selected: #2e2e2e;
        --row-present: rgb(74 222 128 / 0.07);
        --row-present-hover: rgb(74 222 128 / 0.12);

        --text-primary: #fafafa;
        --text-secondary: #a3a3a3;
        --text-tertiary: #737373;
        --text-placeholder: #737373;
        --icon-tertiary: #737373;

        --border: #262626;
        --border-btn: #404040;
        --border-btn-hover: #525252;

        --green-bg: rgb(22 163 74 / 0.16); --green-fg: #4ade80; --green-solid: #16a34a;
        --purple-bg: rgb(147 51 234 / 0.18); --purple-fg: #c084fc; --purple-solid: #a855f7;
        --blue-bg: rgb(59 130 246 / 0.18); --blue-fg: #60a5fa;
        --red-bg: rgb(220 38 38 / 0.16); --red-fg: #f87171;
        --neutral-bg: #262626; --neutral-fg: #a3a3a3;

        --shadow-2xs: 0 1px 1px 0 rgb(0 0 0 / 0.3);
        --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.35);
        --page-veil: rgb(18 18 18 / 0.86);
        color-scheme: dark;
      }

      /* ===== Base ========================================================= */
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; background: var(--bg-page); }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 20px;
        color: var(--text-primary);
        background: var(--bg-page);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      button, input { font: inherit; color: inherit; }
      h1, h2, h3, h4, p { margin: 0; }
      .hidden { display: none !important; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .center { text-align: center; }
      .right { text-align: right; }
      .spin { display: inline-block; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--border-btn); border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Per-event background image (set from the active event), blurred and
         veiled with the page colour so the flat surfaces stay readable. */
      .page-bg, .page-veil { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .page-bg {
        background-size: cover; background-position: center;
        filter: blur(10px); transform: scale(1.08);
      }
      .page-veil { inset: -48px; background: var(--page-veil); }

      /* ===== App shell ==================================================== */
      .app {
        position: relative; z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
      }
      @media (min-width: 768px) { .app { padding: 24px 24px 48px; } }

      .topbar { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
      .topbar-title { flex: 1 1 auto; min-width: 0; }
      .topbar-title h1 { font-size: 16px; line-height: 22px; font-weight: 600; word-break: break-word; }
      .topbar-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
      .topbar-actions { flex: none; display: flex; align-items: center; gap: 6px; }
      .clock {
        display: inline-flex; align-items: center; gap: 4px;
        height: 32px; padding: 0 10px; border-radius: 8px;
        background: var(--bg-surface); border: 1px solid var(--border);
        font-size: 12px; font-weight: 500; color: var(--text-secondary);
        font-variant-numeric: tabular-nums; white-space: nowrap;
      }
      .clock i { font-size: 14px; }
      @media (max-width: 419px) { .clock { display: none; } }
      @media (min-width: 768px) {
        .topbar { align-items: center; margin-bottom: 16px; }
        .topbar-title h1 { font-size: 20px; line-height: 28px; }
      }

      /* ===== Buttons ====================================================== */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        height: 32px; padding: 0 10px;
        border: 1px solid transparent; border-radius: 8px;
        font-size: 13px; font-weight: 500; line-height: 18px;
        white-space: nowrap; text-decoration: none; cursor: pointer; user-select: none;
        transition: background .15s ease, border-color .15s ease, transform .08s ease;
      }
      .btn i { font-size: 16px; line-height: 1; }
      .btn:active { transform: scale(0.97); }
      .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--accent-500); }
      .btn-icon { width: 32px; padding: 0; }
      .btn-secondary {
        color: var(--text-primary); background: var(--bg-surface);
        border-color: var(--border-btn); box-shadow: var(--shadow-xs);
      }
      .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-btn-hover); }

      /* ===== Badges ======================================================= */
      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        height: 20px; padding: 0 6px; border-radius: 6px;
        font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .15px;
        white-space: nowrap;
      }
      .badge i { font-size: 12px; }
      .badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .badge-live::before { animation: livePulse 1.6s ease-in-out infinite; }
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      .tone-blue { background: var(--blue-bg); color: var(--blue-fg); }
      .tone-green { background: var(--green-bg); color: var(--green-fg); }
      .tone-purple { background: var(--purple-bg); color: var(--purple-fg); }
      .tone-red { background: var(--red-bg); color: var(--red-fg); }
      .tone-neutral { background: var(--neutral-bg); color: var(--neutral-fg); }

      /* ===== Stat tiles =================================================== */
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
      @media (min-width: 768px) { .stats { gap: 12px; margin-bottom: 16px; } }
      .stat {
        display: flex; flex-direction: column; gap: 8px; width: 100%;
        padding: 12px; border-radius: 16px;
        background: var(--bg-surface); border: 1px solid var(--border);
        text-align: left; cursor: pointer;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .stat:hover { border-color: var(--border-btn-hover); }
      .stat:focus-visible { outline: none; border-color: var(--accent-500); }
      .stat.is-active { border-color: var(--accent-500); box-shadow: 0 0 0 3px rgb(59 130 246 / 0.15); }
      .stat-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .stat-icon {
        flex: none; display: grid; place-items: center;
        width: 28px; height: 28px; border-radius: 8px; font-size: 16px;
      }
      .stat-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-secondary); }
      .stat-value { font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat-value.is-green { color: var(--green-fg); }
      .stat-value.is-purple { color: var(--purple-fg); }
      .progress { height: 4px; border-radius: 4px; background: var(--bg-input); overflow: hidden; }
      .progress > span { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--purple-solid); transition: width .6s ease; }
      @media (min-width: 768px) {
        .stat { padding: 16px; }
        .stat-value { font-size: 32px; line-height: 40px; }
      }
      /* Mobile: one row of four compact tiles — icon + number only. The label
         stays in the DOM (visually hidden) so screen readers still name each tile. */
      @media (max-width: 767px) {
        .stat { position: relative; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; text-align: center; }
        .stat-top { justify-content: center; }
        .stat-label {
          position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
          overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .stat-value { font-size: 18px; line-height: 24px; }
        .progress { width: calc(100% - 8px); height: 3px; }
      }

      /* ===== Toolbar ====================================================== */
      .panel {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 12px;
      }
      @media (min-width: 768px) { .panel { border-radius: 24px; padding: 16px; } }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
      .input-icon { position: relative; flex: 1 1 100%; min-width: 0; }
      @media (min-width: 640px) { .input-icon { flex: 1 1 240px; } }
      .input-icon > i {
        position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        font-size: 15px; color: var(--icon-tertiary); pointer-events: none;
      }
      .input {
        width: 100%; height: 32px; padding: 0 10px 0 32px;
        border: 1px solid transparent; border-radius: 8px;
        background: var(--bg-input); color: var(--text-primary);
        font-size: 13px; line-height: 18px; outline: none;
        transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
      }
      .input::placeholder { color: var(--text-placeholder); }
      .input:hover { background: var(--bg-input-hover); }
      .input:focus { background: var(--bg-surface); border-color: var(--accent-500); box-shadow: 0 0 0 3px rgb(59 130 246 / 0.18); }
      /* iOS Safari zooms into any field whose text is under 16px. Use 16px
         on touch-sized screens so tapping search/inputs doesn't zoom. */
      @media (max-width: 767px) {
        .input { font-size: 16px !important; }
      }

      .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--seg-bg); flex: 1 1 100%; }
      @media (min-width: 640px) { .seg { flex: 0 0 auto; } }
      .seg-item {
        flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent;
        color: var(--text-secondary); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer;
        transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
      }
      .seg-item:hover { color: var(--text-primary); }
      .seg-item.is-active { background: var(--seg-selected); color: var(--text-primary); box-shadow: var(--shadow-2xs); }
      .seg-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-500); }
      .seg-count { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

      /* ===== Table (desktop) vs list (mobile) ============================ */
      .view-desktop { display: none; }
      .view-mobile { display: flex; }
      @media (min-width: 1024px) {
        .view-desktop { display: block; }
        .view-mobile { display: none !important; }
      }
      .table-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: auto; }
      .table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 18px; }
      .table th {
        position: sticky; top: 0; z-index: 2;
        padding: 8px 12px; text-align: left; white-space: nowrap;
        font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-secondary);
        background: var(--bg-tile); border-bottom: 1px solid var(--border);
      }
      .table th.center { text-align: center; }
      .table th.right { text-align: right; }
      .table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      .table tbody tr:last-child td { border-bottom: 0; }
      .table tbody tr { transition: background-color .12s ease; }
      .table tbody tr:hover { background: var(--bg-hover); }
      .table tbody tr.is-present { background: var(--row-present); }
      .table tbody tr.is-present:hover { background: var(--row-present-hover); }
      .cell-title { font-weight: 600; }
      .cell-muted { font-size: 12px; color: var(--text-secondary); }
      .cell-sub { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--text-tertiary); }
      .cell-time { font-size: 12px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

      .list { flex-direction: column; gap: 8px; }
      .item {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 10px 12px; border-radius: 14px;
        background: var(--bg-surface); border: 1px solid var(--border);
      }
      .item.is-present { background: var(--row-present); border-color: transparent; }
      .item-dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--border-btn-hover); }
      .item.is-present .item-dot { background: var(--green-solid); }
      .item-main { flex: 1 1 auto; min-width: 0; }
      .item-title { font-size: 14px; line-height: 20px; font-weight: 600; word-break: break-word; }
      .item-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
      .item-meta span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
      .item-meta i { font-size: 13px; color: var(--icon-tertiary); }
      .item-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

      /* ===== States ======================================================= */
      .state {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 40px 16px; text-align: center;
        border: 1px dashed var(--border-btn); border-radius: 16px;
        color: var(--text-secondary); font-size: 13px;
      }
      .state > i { font-size: 28px; color: var(--icon-tertiary); }
      .state-title { font-weight: 600; color: var(--text-primary); }
    </style>
  </head>
  <body>
    <div id="pageBg" class="page-bg hidden"></div>
    <div id="pageVeil" class="page-veil hidden"></div>

    <div class="app">
      <!-- Top bar -->
      <header class="topbar">
        <a href="index.html" class="btn btn-secondary btn-icon" title="Kembali ke Utama" aria-label="Kembali ke Utama">
          <i class="ri-home-5-line"></i>
        </a>
        <div class="topbar-title">
          <h1 id="eventTitle">Senarai Kehadiran</h1>
          <div class="topbar-sub">
            <span id="onlineStatus" class="badge badge-dot badge-live tone-green">Live</span>
            <span id="eventMeta" class="truncate"></span>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="currentTime" class="clock"></span>
          <button id="themeToggle" type="button" onclick="toggleTheme()" class="btn btn-secondary btn-icon" title="Tukar tema" aria-label="Tukar tema">
            <i class="ri-moon-line"></i>
          </button>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats">
        <button type="button" id="statCardTotal" onclick="quickFilterAttendance('')" class="stat" title="Jumlah Jemputan — papar semua">
          <span class="stat-top"><span class="stat-icon tone-blue"><i class="ri-team-line"></i></span><span class="stat-label truncate">Jumlah Jemputan</span></span>
          <span id="statTotal" class="stat-value">0</span>
        </button>
        <button type="button" id="statCardPresent" onclick="quickFilterAttendance('present')" class="stat" title="Hadir — tapis hadir sahaja" aria-pressed="false">
          <span class="stat-top"><span class="stat-icon tone-green"><i class="ri-user-follow-line"></i></span><span class="stat-label truncate">Hadir</span></span>
          <span id="statPresent" class="stat-value is-green">0</span>
        </button>
        <button type="button" id="statCardAbsent" onclick="quickFilterAttendance('absent')" class="stat" title="Belum Hadir — tapis belum hadir sahaja" aria-pressed="false">
          <span class="stat-top"><span class="stat-icon tone-neutral"><i class="ri-time-line"></i></span><span class="stat-label truncate">Belum Hadir</span></span>
          <span id="statAbsent" class="stat-value">0</span>
        </button>
        <button type="button" id="statCardRate" onclick="quickFilterAttendance('')" class="stat" title="Peratus Kehadiran — papar semua">
          <span class="stat-top"><span class="stat-icon tone-purple"><i class="ri-pie-chart-2-line"></i></span><span class="stat-label truncate">Peratus Kehadiran</span></span>
          <span id="statRate" class="stat-value is-purple">0%</span>
          <span class="progress" aria-hidden="true"><span id="statRateBar"></span></span>
        </button>
      </div>

      <main class="panel">
        <div class="toolbar">
          <div class="input-icon">
            <i class="ri-search-line"></i>
            <input type="text" id="searchInput" oninput="filterData()" class="input" placeholder="Cari nama staf..." />
          </div>
          <div class="seg" role="group" aria-label="Tapis status">
            <button type="button" id="segAll" class="seg-item is-active" onclick="setStatusFilter('')">Semua <span id="segAllCount" class="seg-count"></span></button>
            <button type="button" id="segPresent" class="seg-item" onclick="setStatusFilter('present')">Hadir <span id="segPresentCount" class="seg-count"></span></button>
            <button type="button" id="segAbsent" class="seg-item" onclick="setStatusFilter('absent')">Belum <span id="segAbsentCount" class="seg-count"></span></button>
          </div>
        </div>

        <div id="mainContent">
          <div class="view-desktop table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th style="width:34%">Nama Staf</th>
                  <th>Jawatan &amp; Lokasi</th>
                  <th class="center">Kehadiran</th>
                  <th class="right">Masa Rekod</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div id="cardsBody" class="view-mobile list"></div>
        </div>

        <div id="loadingIndicator" class="state">
          <i class="ri-loader-4-line spin"></i>
          <p>Mengemaskini data kehadiran...</p>
        </div>

        <div id="emptyState" class="state hidden">
          <i class="ri-search-line"></i>
          <p class="state-title">Tiada rekod ditemui</p>
          <p>Cuba carian dengan kata kunci lain.</p>
        </div>
      </main>
    </div>

    <script>
      let mergedData = [];
      let statusFilter = ''; // '' | 'present' | 'absent'
      let isLoading = true;
      let backgroundLight = "";
      let backgroundDark = "";

      // Initialize
      window.onload = async () => {
        syncThemeIcon();
        updateTime();
        setInterval(updateTime, 1000);
        await refreshData();

        // Auto refresh
        setInterval(refreshData, 30000);

        // Follow the OS theme only while the user hasn't picked one.
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
          let saved = null;
          try { saved = localStorage.getItem('theme'); } catch (err) {}
          if (!saved) {
            document.documentElement.classList.toggle('dark-mode', e.matches);
            syncThemeIcon();
            applyCustomBackground();
          }
        });
      };

      // --- Theme (same "theme" localStorage key as index.html / setup.html) ---
      function isDark() {
        return document.documentElement.classList.contains('dark-mode');
      }

      function syncThemeIcon() {
        const btn = document.getElementById('themeToggle');
        if (btn) btn.innerHTML = `<i class="${isDark() ? 'ri-sun-line' : 'ri-moon-line'}"></i>`;
      }

      function toggleTheme() {
        const dark = !isDark();
        document.documentElement.classList.toggle('dark-mode', dark);
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        syncThemeIcon();
        applyCustomBackground();
      }

      function applyCustomBackground() {
        const url = isDark() ? backgroundDark : backgroundLight;
        const bg = document.getElementById('pageBg');
        const veil = document.getElementById('pageVeil');
        const has = url && url.trim() !== '' && url !== 'undefined';
        if (has) bg.style.backgroundImage = `url("${url.replace(/"/g, '%22')}")`;
        bg.classList.toggle('hidden', !has);
        veil.classList.toggle('hidden', !has);
      }

      function updateTime() {
        const now = new Date();
        document.getElementById('currentTime').innerHTML =
          `<i class="ri-time-line"></i>${now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      }

      function setOnlineStatus(online) {
        const el = document.getElementById('onlineStatus');
        el.className = online ? 'badge badge-dot badge-live tone-green' : 'badge badge-dot tone-red';
        el.textContent = online ? 'Live' : 'Offline';
      }

      async function refreshData() {
        const loading = document.getElementById('loadingIndicator');
        const content = document.getElementById('mainContent');

        if (isLoading) {
          loading.classList.remove('hidden');
          content.classList.add('hidden');
        }

        try {
          // Fetch settings, staff, and attendance
          const [settingsRes, staffRes, attendRes] = await Promise.all([
            fetch('/api/admin-settings'),
            fetch('/api/get-staff'),
            fetch('/api/attendance/list')
          ]);

          const settingsData = await settingsRes.json();
          const staffData = await staffRes.json();
          const attendData = await attendRes.json();

          // 1. Settings & Background
          if (settingsData) {
            if (settingsData.title) {
              document.getElementById('eventTitle').textContent = settingsData.title;
              document.title = `E-HADIR | ${settingsData.title}`;
            }
            const meta = [settingsData.date, settingsData.location].filter(Boolean).join(' · ');
            document.getElementById('eventMeta').textContent = meta;

            backgroundLight = settingsData.backgroundLight;
            backgroundDark = settingsData.backgroundDark;
            applyCustomBackground();
          }

          if (staffData.success && attendData.success) {
            processData(staffData.staff, attendData.attendance);
          }

          setOnlineStatus(true);
        } catch (error) {
          console.error('Error fetching data:', error);
          setOnlineStatus(false);
        } finally {
          isLoading = false;
          loading.classList.add('hidden');
          content.classList.remove('hidden');
        }
      }

      function processData(staffList, attendanceList) {
        const attendanceMap = new Map();
        attendanceList.forEach(a => {
          attendanceMap.set(a.staff_id.toString().toLowerCase(), a);
        });

        mergedData = [];
        staffList.forEach(staff => {
          const attendRecord = attendanceMap.get(staff.id.toString().toLowerCase());
          const isInvited = (staff.status || '').toUpperCase() === 'JEMPUTAN';
          // Check if attendance status specifically says 'WAKIL'
          const isWakil = attendRecord && (attendRecord.status || '').toUpperCase() === 'WAKIL';

          // Show if Invited OR is a Wakil (even if not invited)
          if (isInvited || isWakil) {
            // An auto-marked TIDAK HADIR row (event date passed, never
            // checked in) is a record, but not attendance.
            const isAbsent = !!attendRecord && (attendRecord.status || '').toUpperCase() === 'TIDAK HADIR';
            mergedData.push({
              ...staff,
              isPresent: !!attendRecord && !isAbsent,
              isAbsent,
              attendStatus: attendRecord ? attendRecord.status : null,
              timestamp: attendRecord ? attendRecord.timestamp : null
            });
          }
        });

        mergedData.sort((a, b) => {
          if ((a.ranking_order || 9999) !== (b.ranking_order || 9999)) {
            return (a.ranking_order || 9999) - (b.ranking_order || 9999);
          }
          return a.name.localeCompare(b.name);
        });

        updateStats();
        filterData();
      }

      function updateStats() {
        const total = mergedData.length;
        const present = mergedData.filter(d => d.isPresent).length;
        const absent = total - present;
        const rate = total > 0 ? Math.round((present / total) * 100) : 0;

        animateValue('statTotal', parseInt(document.getElementById('statTotal').innerText) || 0, total, 800);
        animateValue('statPresent', parseInt(document.getElementById('statPresent').innerText) || 0, present, 800);
        animateValue('statAbsent', parseInt(document.getElementById('statAbsent').innerText) || 0, absent, 800);
        document.getElementById('statRate').innerText = `${rate}%`;
        document.getElementById('statRateBar').style.width = `${rate}%`;

        document.getElementById('segAllCount').textContent = total;
        document.getElementById('segPresentCount').textContent = present;
        document.getElementById('segAbsentCount').textContent = absent;
      }

      function animateValue(id, start, end, duration) {
        if (start === end) return;
        const obj = document.getElementById(id);
        const range = end - start;
        let minTimer = 50;
        let stepTime = Math.abs(Math.floor(duration / range));
        stepTime = Math.max(stepTime, minTimer);
        let startTime = new Date().getTime();
        let endTime = startTime + duration;
        let timer;

        function run() {
          let now = new Date().getTime();
          let remaining = Math.max((endTime - now) / duration, 0);
          let value = Math.round(end - (remaining * range));
          obj.innerHTML = value;
          if (value == end) clearInterval(timer);
        }

        timer = setInterval(run, stepTime);
        run();
      }

      function renderData(data) {
        const tbody = document.getElementById('tableBody');
        const cards = document.getElementById('cardsBody');

        tbody.innerHTML = '';
        cards.innerHTML = '';

        if (data.length === 0) {
          document.getElementById('emptyState').classList.remove('hidden');
          return;
        }
        document.getElementById('emptyState').classList.add('hidden');

        data.forEach(item => {
          const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleTimeString('ms-MY', {hour: '2-digit', minute:'2-digit'}) : '-';
          const isWakil = (item.attendStatus || '').toUpperCase() === 'WAKIL';

          const statusBadge = item.isPresent
            ? `<span class="badge tone-green"><i class="ri-checkbox-circle-fill"></i>${isWakil ? 'WAKIL' : 'HADIR'}</span>`
            : item.isAbsent
              ? `<span class="badge tone-red"><i class="ri-close-circle-fill"></i>TIDAK HADIR</span>`
              : `<span class="badge tone-neutral"><i class="ri-time-line"></i>BELUM</span>`;

          tbody.innerHTML += `
            <tr class="${item.isPresent ? 'is-present' : ''}">
              <td><div class="cell-title">${item.name}</div></td>
              <td>
                <div class="cell-muted">${item.position || '-'}</div>
                <div class="cell-sub"><i class="ri-map-pin-line"></i>${item.location || '-'}</div>
              </td>
              <td class="center">${statusBadge}</td>
              <td class="right cell-time">${timeStr}</td>
            </tr>
          `;

          cards.innerHTML += `
            <div class="item ${item.isPresent ? 'is-present' : ''}">
              <span class="item-dot" aria-hidden="true"></span>
              <div class="item-main">
                <h4 class="item-title">${item.name}</h4>
                <div class="item-meta">
                  <span class="truncate"><i class="ri-briefcase-line"></i>${item.position || '-'}</span>
                  <span class="truncate"><i class="ri-map-pin-line"></i>${item.location || '-'}</span>
                </div>
              </div>
              <div class="item-side">
                ${statusBadge}
                ${item.isPresent ? `<span class="cell-time">${timeStr}</span>` : ''}
              </div>
            </div>
          `;
        });
      }

      function filterData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = mergedData.filter(item => {
          const searchMatch = item.name.toLowerCase().includes(q);
          const statusMatch =
            !statusFilter ||
            (statusFilter === 'present' ? item.isPresent : !item.isPresent);
          return searchMatch && statusMatch;
        });
        renderData(filtered);
      }

      // Stat tiles toggle their filter; the segmented control sets it directly.
      function quickFilterAttendance(status) {
        setStatusFilter(statusFilter === status ? '' : status);
      }

      function setStatusFilter(status) {
        statusFilter = status;
        updateFilterState();
        filterData();
      }

      function updateFilterState() {
        const tiles = { present: 'statCardPresent', absent: 'statCardAbsent' };
        Object.entries(tiles).forEach(([key, id]) => {
          const el = document.getElementById(id);
          el.classList.toggle('is-active', statusFilter === key);
          el.setAttribute('aria-pressed', statusFilter === key ? 'true' : 'false');
        });
        const segs = { '': 'segAll', present: 'segPresent', absent: 'segAbsent' };
        Object.entries(segs).forEach(([key, id]) => {
          document.getElementById(id).classList.toggle('is-active', statusFilter === key);
        });
      }
    </script>
  </body>
</html>
